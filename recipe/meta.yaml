{% set name = "pypiserver" %}
{% set version = "2.4.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pypiserver-{{ version }}.tar.gz
  sha256: 302737e7182fde89c120c6c53ae9602a55c8bd1449d9c4f364d00ffe602d4535

build:
  entry_points:
    - pypi-server=pypiserver.__main__:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
    - setuptools-git >=0.3
    - wheel >=0.25.0
  run:
    - python >={{ python_min }}
    - pip >=7
    - packaging >=23.2
    - importlib_resources

test:
  imports:
    - pypiserver
  commands:
    - pip check
    - pypi-server --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pypiserver/pypiserver
  summary: A minimal PyPI server for use with pip/easy_install.
  license: MIT
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - jtpio
